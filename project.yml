name: AmbientHaptics
options:
  bundleIdPrefix: ca.anchit
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    CODE_SIGNING_ALLOWED: NO
targets:
  AmbientHaptics:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Ambient Haptics
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.anchit.AmbientHaptics
        GENERATE_INFOPLIST_FILE: NO
  AmbientHapticsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: AmbientHaptics
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
